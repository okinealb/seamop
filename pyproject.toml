# This file is used to configure the Python project and its dependencies.

# Build system requirements
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Project metadata
[project]
name = "seamop"
version = "0.4.0"
description = "A Python library and CLI for content-aware image resizing using seam carving."
authors = [{ name = "Albert Kenneth" }]
license = "MIT"
license-files = ["LICENSE"]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
dependencies = [
    "cyclopts>=4.22.2,<5",
    "numpy>=1.20.0",
    "Pillow>=8.0.0",
    "scipy>=1.7.0",
]
keywords = ["seam-carving", "image-processing", "computer-vision", "image-resizing"]
classifiers = [
    # Project classification
    "Development Status :: 4 - Beta",
    # Audience
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    # Environment
    "Environment :: Console",
    # OS Compatibility
    "Operating System :: OS Independent",
    # Programming Language
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    # Topics
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Utilities",
]

# URLs for the main project repository
[project.urls]
Homepage = "https://github.com/okinealb/seamop"
Repository = "https://github.com/okinealb/seamop.git"
Issues = "https://github.com/okinealb/seamop/issues"

# Optional scripts to run the command-line interface
[project.scripts]
seamop = "seamop.cli:main"

# Optional dependencies for development and testing
[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=7.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.0",
    "ruff>=0.9.0",
]

# Configuration for setuptools to find packages correctly
[tool.setuptools.packages.find]
where = ["src"]
include = ["seamop*"]
exclude = ["tests*", "test*", "build*", "dist*", "*.egg-info*"]

[tool.setuptools.package-data]
seamop = ["py.typed"]

# Pytest configuration 
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-config",
    "--benchmark-columns=mean,median,stddev,rounds",
    "--benchmark-sort=mean",
    "--benchmark-group-by=param:num_seams",
    "--benchmark-name=short",
]
console_output_style = "progress"

[tool.coverage.run]
branch = true
source = ["seamop"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/seamop"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["scipy.ndimage"]
ignore_missing_imports = true
