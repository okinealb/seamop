name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check native formatting
        run: cargo fmt --manifest-path native/Cargo.toml -- --check

      - name: Lint native code
        run: cargo clippy --manifest-path native/Cargo.toml -- -D warnings

      - name: Test native code
        run: cargo test --manifest-path native/Cargo.toml

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.10"
          enable-cache: true

      - name: Check lockfile
        run: uv lock --check

      - name: Install project
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run --frozen ruff check src tests benchmarks

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests benchmarks

      - name: Type check
        run: uv run --frozen mypy

      - name: Check coverage
        run: uv run --frozen pytest --cov

      - name: Check docstring examples
        run: uv run --frozen pytest --doctest-modules src/seamop

      - name: Build package
        run: uv build

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project
        run: uv sync --extra dev --frozen

      - name: Run tests
        run: uv run --frozen pytest
