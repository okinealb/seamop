name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.10"
          enable-cache: true

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv version --short)"

          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag version $tag_version does not match project version $project_version." >&2
            exit 1
          fi

      - name: Check lockfile
        run: uv lock --check

      - name: Install project
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run --frozen ruff check src tests benchmarks

      - name: Check formatting
        run: uv run --frozen ruff format --check src tests benchmarks

      - name: Type check
        run: uv run --frozen mypy

      - name: Check coverage
        run: uv run --frozen pytest --cov

      - name: Check docstring examples
        run: uv run --frozen pytest --doctest-modules src/seamop

  build-sdist:
    name: Build source distribution
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.10"
          enable-cache: true

      - name: Build source distribution
        run: uv build --sdist --no-sources

      - name: Store source distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Build ${{ matrix.name }} wheel
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            interpreter: python3.10
            manylinux: "2014"
          - name: macos-arm64
            runner: macos-15
            interpreter: python
            manylinux: "off"
          - name: macos-x86_64
            runner: macos-15-intel
            interpreter: python
            manylinux: "off"
          - name: windows-x86_64
            runner: windows-2025
            interpreter: python
            manylinux: "off"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          python-version: "3.10"
          enable-cache: true

      - name: Build wheel
        uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380 # v1.49.4
        with:
          maturin-version: v1.13.3
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist --compatibility pypi -i ${{ matrix.interpreter }}

      - name: Store wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish distribution packages to PyPI
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: pypi
      url: https://pypi.org/project/seamop/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Retrieve distribution packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true

      - name: Publish distribution packages to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
